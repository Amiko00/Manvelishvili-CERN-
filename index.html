<!DOCTYPE html>
<html lang="ka">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D ფიგურები — OrbitControls</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111827; color: #f3f4f6; font-family: Arial, sans-serif; }
    canvas { display: block; touch-action: none; }
    .info { position: fixed; top: 20px; left: 20px; right: 20px; pointer-events: none; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; font-size: 14px; line-height: 1.7; color: #cbd5e1; }
    .legend { position: fixed; left: 20px; bottom: 20px; right: 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 14px; pointer-events: none; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color); }
    @media (max-width: 600px) { h1 { font-size: 20px; } p, .legend { font-size: 12px; } }

  </style>
</head>
<body>

  <div class="info">

    <h1>3D ფიგურები</h1>

    <p>მაუსის მარცხენა ღილაკით მოძრაობა ირგვლივ <br />მარჯვენა ღილაკით კამერის მოძრაობა ჰორიზონტალურად/ვერტიკალურად</p>
  </div>

  <div class="legend" aria-label="ფიგურების ფერები">

    <span><i class="dot" style="--color: #60a5fa"></i>კუბი</span>
    <span><i class="dot" style="--color: #f472b6"></i>სფერო</span>
    <span><i class="dot" style="--color: #fbbf24"></i>კონუსი</span>
    <span><i class="dot" style="--color: #34d399"></i>ცილინდრი</span>
    <span><i class="dot" style="--color: #a78bfa"></i>ტორუსი (დონატი)</span>

  </div>

   <!-- ბიბლიოთეკა და კონტროლი ერთი და იმავე ვერსიიდან იტვირთება: -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="./main_2.js"></script>

</body>

</html>
