<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 9 </title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #111827; color: #f3f4f6; font-family: Arial, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }

    h1 { position: fixed; top: 24px; left: 24px; right: 24px; margin: 0; font-size: 28px; pointer-events: none; text-shadow: 0 2px 8px #000; }
    footer { position: fixed; left: 24px; right: 24px; bottom: 24px; pointer-events: none; }
    .status { margin: 0 0 8px; color: #cbd5e1; font-size: 13px; line-height: 1.6; }
    .zoli { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end;  }
    .credit, details { max-width: 100%; margin: 0; border-radius: 4px; background: #111827cc; color: #e2e8f0; font-size: 12px; pointer-events: auto; }
    .credit, summary { padding: 6px 10px; font-size: 15px; }
    a, summary { color: #dbeafe; cursor: pointer;  }
    a { text-decoration: none; }
    a:hover, summary:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid #93c5fd; outline-offset: 4px; }
    [hidden] { display: none !important; }

    .martva { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px; width: 224px; max-width: 100%; padding: 4px 10px 6px; }
    output { font-variant-numeric: tabular-nums; }
    input[type="range"] { grid-column: 1 / -1; width: 100%; height: 24px; margin: 0; accent-color: #93c5fd; cursor: pointer; }
    @media (max-width: 600px) {
      h1 { top: 18px; left: 16px; right: 16px; font-size: 22px; }
      footer { left: 16px; right: 16px; bottom: 18px; }
      .credit, details { font-size: 11px; }
    }
  </style>
</head>
<body>
  <canvas id="tilo" role="img" aria-label="დედამიწის სფერო და სამი საკოორდინატო ღერძი"></canvas>
  <h1>დედამიწის განათება</h1>
  <footer>
    <p id="mdgomareoba" class="status" role="status">რუკა იტვირთება…</p>
    <div class="zoli">
      <p class="credit">ტექსტურა · <a href="https://svs.gsfc.nasa.gov/2915/" target="_blank" rel="noopener noreferrer">NASA/Goddard SVS</a></p>
      <details>
        <summary>განათება</summary>
        <div class="martva">
          <label for="simdzlavre">სინათლის სიმძლავრე</label>
          <output id="machvenebeli" for="simdzlavre">1.1</output>
          <input id="simdzlavre" type="range" min="0" max="2" value="1.1" step="0.1">
        </div>
      </details>
    </div>
  </footer>

  <script src="./libs/three.min.js"></script>
  <script src="./libs/OrbitControls.js"></script>
  <script src="./main.js"></script>
</body>
</html>
